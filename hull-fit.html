<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>船身对位调参 · wooden_hull.glb</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f0; font-family: system-ui, -apple-system, sans-serif; }
  #hud {
    position: fixed; left: 14px; top: 14px; z-index: 10; color: #123;
    background: rgba(255,255,255,.78); padding: 12px 14px; border-radius: 12px;
    font-size: 12.5px; line-height: 1.55; backdrop-filter: blur(6px);
    width: 268px; box-shadow: 0 6px 24px rgba(0,0,0,.12);
  }
  #hud h3 { margin: 0 0 6px; font-size: 14px; }
  .row { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
  .row label { width: 74px; flex: none; color: #345; }
  .row input[type=range] { flex: 1; min-width: 0; }
  .row .val { width: 46px; text-align: right; font-variant-numeric: tabular-nums; }
  .seg { display: flex; gap: 4px; margin-top: 5px; }
  .seg button {
    flex: 1; padding: 4px 0; font-size: 12px; border: 1px solid #9bb; background: #fff;
    border-radius: 6px; cursor: pointer; color: #234;
  }
  .seg button.on { background: #2a6f8f; color: #fff; border-color: #2a6f8f; }
  #out {
    margin-top: 9px; padding: 7px 8px; background: #10222c; color: #9fe8c8;
    border-radius: 7px; font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    white-space: pre; line-height: 1.45; user-select: all;
  }
  .chk { display: flex; align-items: center; gap: 5px; margin-top: 5px; }
  .hint { color: #567; font-size: 11.5px; margin-top: 7px; line-height: 1.45; }
  #views { position: fixed; right: 14px; top: 14px; z-index: 10; display: flex; gap: 6px; }
  #views button {
    padding: 6px 12px; font-size: 12.5px; border: 1px solid #9bb; background: rgba(255,255,255,.8);
    border-radius: 8px; cursor: pointer; color: #234;
  }
  #views button.on { background: #2a6f8f; color: #fff; border-color: #2a6f8f; }
</style>
<script type="importmap">
{ "imports": { "three": "./assets/vendor/three.module.js" } }
</script>
</head>
<body>
<div id="hud">
  <h3>船身对位调参</h3>
  <div class="row"><label>rotY</label><input id="rot" type="range" min="-180" max="180" step="90" value="-90"><span class="val" id="rotv">-90°</span></div>
  <div class="row"><label>scale X</label><input id="sx" type="range" min="0.5" max="12" step="0.02" value="5.00"><span class="val" id="sxv">5.00</span></div>
  <div class="row"><label>scale Y</label><input id="sy" type="range" min="0.5" max="12" step="0.02" value="3.47"><span class="val" id="syv">3.47</span></div>
  <div class="row"><label>scale Z</label><input id="sz" type="range" min="0.5" max="14" step="0.02" value="3.99"><span class="val" id="szv">3.99</span></div>
  <div class="row"><label>pos Y</label><input id="py" type="range" min="-2" max="3" step="0.01" value="0.00"><span class="val" id="pyv">0.00</span></div>
  <div class="row"><label>pos Z</label><input id="pz" type="range" min="-3" max="3" step="0.01" value="0.00"><span class="val" id="pzv">0.00</span></div>
  <div class="row"><label>pos X</label><input id="px" type="range" min="-2" max="2" step="0.01" value="0.00"><span class="val" id="pxv">0.00</span></div>
  <div class="chk"><input id="ref" type="checkbox" checked><label for="ref" style="width:auto">显示程序化船身参照框</label></div>
  <div class="chk"><input id="wire" type="checkbox"><label for="wire" style="width:auto">线框模式</label></div>
  <div id="out">loading…</div>
  <div class="hint">参照框 = 现有程序化船身包围盒（长 5.05 / 宽 1.40 / 舷缘 0.82）。让新船身大致填满它即可。参数可直接复制。</div>
</div>
<div id="views">
  <button data-v="persp" class="on">透视</button>
  <button data-v="side">侧视</button>
  <button data-v="top">俯视</button>
  <button data-v="front">船头</button>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './assets/vendor/GLTFLoader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe3f0);
scene.fog = new THREE.Fog(0xbfe3f0, 25, 60);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 200);

scene.add(new THREE.HemisphereLight(0xffffff, 0x4a6b7a, 1.0));
const sun = new THREE.DirectionalLight(0xfff2d8, 1.6);
sun.position.set(6, 12, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;
sun.shadow.camera.far = 40;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0xaad4ff, 0.35).translateX(-6).translateY(4).translateZ(-6));

// 水面
const water = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 120),
  new THREE.MeshStandardMaterial({ color: 0x2f6f8f, roughness: 0.35, metalness: 0.1, transparent: true, opacity: 0.9 })
);
water.rotation.x = -Math.PI / 2;
water.receiveShadow = true;
scene.add(water);
const grid = new THREE.GridHelper(40, 80, 0xffffff, 0x66aacc);
grid.material.transparent = true; grid.material.opacity = 0.25;
grid.position.y = 0.002;
scene.add(grid);

// 程序化船身参照包围盒（含 y=0.05 偏移）
const REF = { min: new THREE.Vector3(-0.70, -0.50, -2.50), max: new THREE.Vector3(0.70, 0.82, 2.55) };
const refBox = new THREE.Box3(REF.min, REF.max);
const refHelper = new THREE.Box3Helper(refBox, 0xff3366);
refHelper.material.linewidth = 2;
scene.add(refHelper);

// rig 参照：桅杆 / 帆 / 舵 / 风向标位置
const rigRef = new THREE.Group();
const mastRef = new THREE.Mesh(
  new THREE.CylinderGeometry(0.07, 0.09, 6.0, 8),
  new THREE.MeshBasicMaterial({ color: 0x3355ff, wireframe: true, transparent: true, opacity: 0.5 })
);
mastRef.position.set(0, 0.82 + 3.0, -0.3);
rigRef.add(mastRef);
const rudderRef = new THREE.Mesh(
  new THREE.BoxGeometry(0.06, 1.0, 0.6),
  new THREE.MeshBasicMaterial({ color: 0x33aa55, wireframe: true, transparent: true, opacity: 0.55 })
);
rudderRef.position.set(0, 0.0, 2.4);
rigRef.add(rudderRef);
scene.add(rigRef);

// ---- 模型 ----
const pivot = new THREE.Group();      // 承载 rotY
const inner = new THREE.Group();      // 承载 scale（先缩放后旋转）
pivot.add(inner);
scene.add(pivot);
let model = null, rawBox = null;

new GLTFLoader().load('./assets/3d/wooden_hull.glb', (gltf) => {
  model = gltf.scene;
  model.traverse(o => {
    if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
  });
  inner.add(model);
  rawBox = new THREE.Box3().setFromObject(model);
  apply();
}, undefined, (e) => { document.getElementById('out').textContent = 'GLB 加载失败: ' + e; });

const ids = ['rot','sx','sy','sz','px','py','pz'];
const el = id => document.getElementById(id);
ids.forEach(id => el(id).addEventListener('input', apply));
el('ref').addEventListener('change', e => { refHelper.visible = e.target.checked; rigRef.visible = e.target.checked; });
el('wire').addEventListener('change', e => {
  if (!model) return;
  model.traverse(o => { if (o.isMesh) o.material.wireframe = e.target.checked; });
});

function apply() {
  if (!model) return;
  const rot = +el('rot').value, sx = +el('sx').value, sy = +el('sy').value, sz = +el('sz').value;
  const px = +el('px').value, py = +el('py').value, pz = +el('pz').value;
  el('rotv').textContent = rot + '°';
  ['sx','sy','sz','px','py','pz'].forEach(k => el(k + 'v').textContent = (+el(k).value).toFixed(2));

  pivot.rotation.y = rot * Math.PI / 180;
  inner.scale.set(sx, sy, sz);
  pivot.position.set(px, py, pz);

  scene.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(pivot);
  const s = box.getSize(new THREE.Vector3());
  const c = box.getCenter(new THREE.Vector3());
  el('out').textContent =
`raw   X ${(rawBox.max.x-rawBox.min.x).toFixed(3)}  Y ${(rawBox.max.y-rawBox.min.y).toFixed(3)}  Z ${(rawBox.max.z-rawBox.min.z).toFixed(3)}
world L(Z) ${s.z.toFixed(2)}  W(X) ${s.x.toFixed(2)}  H(Y) ${s.y.toFixed(2)}
bbox  y ${box.min.y.toFixed(2)} → ${box.max.y.toFixed(2)}   z ${box.min.z.toFixed(2)} → ${box.max.z.toFixed(2)}   x ${box.min.x.toFixed(2)} → ${box.max.x.toFixed(2)}
center z ${c.z.toFixed(2)} x ${c.x.toFixed(2)}
──────────────
HULL_ROT_Y   = ${rot}
HULL_SCALE   = (${sx.toFixed(3)}, ${sy.toFixed(3)}, ${sz.toFixed(3)})
HULL_POSITION= (${px.toFixed(3)}, ${py.toFixed(3)}, ${pz.toFixed(3)})`;
}

// ---- 相机：轨道 + 预设视角 ----
let yaw = 0.9, pitch = 0.5, dist = 12, autoSpin = true, preset = 'persp';
let dragging = false, lx = 0, ly = 0;
renderer.domElement.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => {
  if (!dragging) return;
  yaw -= (e.clientX - lx) * 0.007; pitch -= (e.clientY - ly) * 0.007;
  pitch = Math.max(0.05, Math.min(1.5, pitch));
  lx = e.clientX; ly = e.clientY; preset = 'persp'; syncBtns();
});
addEventListener('wheel', e => { dist = Math.max(3, Math.min(40, dist + e.deltaY * 0.012)); }, { passive: true });

document.querySelectorAll('#views button').forEach(b => b.addEventListener('click', () => {
  preset = b.dataset.v; syncBtns();
}));
function syncBtns() {
  document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.dataset.v === preset));
}

function tick() {
  requestAnimationFrame(tick);
  const t = { persp: [yaw, pitch], side: [Math.PI / 2, 1.42], top: [Math.PI / 2, 0.08], front: [0, 1.45] }[preset];
  let y = t[0], p = t[1];
  if (preset === 'persp' && autoSpin && !dragging) y += 0.0015;
  if (preset === 'persp') yaw = y;
  const cy = new THREE.Vector3(0, 0, 0);
  camera.position.set(
    cy.x + dist * Math.sin(p) * Math.sin(y),
    cy.y + dist * Math.cos(p),
    cy.z + dist * Math.sin(p) * Math.cos(y)
  );
  camera.lookAt(0, 0.3, 0);
  renderer.render(scene, camera);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
